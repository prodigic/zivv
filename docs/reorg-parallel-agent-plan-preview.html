<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zivv Reorganization Plan for Parallel Agents</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.65;
        --background: #f8fafc;
        --surface: #ffffff;
        --text: #172033;
        --muted: #526174;
        --border: #dbe3ec;
        --code: #eef2f7;
        --link: #2563eb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #101722;
          --surface: #182230;
          --text: #e6edf5;
          --muted: #a9b8c9;
          --border: #334155;
          --code: #0f172a;
          --link: #8ab4ff;
        }
      }

      body {
        background: var(--background);
        color: var(--text);
        margin: 0;
      }

      main {
        background: var(--surface);
        margin: 0 auto;
        max-width: 1100px;
        min-height: 100vh;
        padding: 32px clamp(20px, 5vw, 72px) 64px;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      h2 {
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.35em;
        margin-top: 2em;
      }

      h3 {
        margin-top: 1.6em;
      }

      a {
        color: var(--link);
      }

      code,
      pre {
        font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      }

      code {
        background: var(--code);
        border-radius: 4px;
        padding: 0.12em 0.3em;
      }

      pre {
        background: var(--code);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow-x: auto;
        padding: 16px;
      }

      pre code {
        background: transparent;
        padding: 0;
      }

      table {
        border-collapse: collapse;
        display: block;
        max-width: 100%;
        overflow-x: auto;
        margin: 1.25em 0;
      }

      th,
      td {
        border: 1px solid var(--border);
        padding: 8px 12px;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: var(--code);
      }

      .error {
        color: #dc2626;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main id="content">Loading document…</main>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      (async () => {
        const content = document.getElementById("content");

        try {
          const response = await fetch("./reorg-parallel-agent-plan.md", {
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error(`Markdown request failed: ${response.status}`);
          }

          const markdown = await response.text();
          content.innerHTML = marked.parse(markdown, { gfm: true });
        } catch (error) {
          content.innerHTML = `<p class="error">Unable to render the Markdown document: ${error.message}</p>`;
        }
      })();
    </script>
  </body>
</html>
