name: Test Suite

on:
    workflow_dispatch:
        inputs:
            update_snapshots:
                description: "Generate Linux screenshots for review"
                type: boolean
                default: false
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.19.0"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run ETL build
              run: npm run build:etl

            - name: Run unit tests with coverage
              run: npm run test:coverage

            - name: Upload coverage reports
              uses: codecov/codecov-action@v3
              with:
                  file: ./coverage/coverage.json
                  fail_ci_if_error: false

            - name: Upload unit test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: unit-test-results
                  path: |
                      coverage/
                      test-results/

    e2e-tests:
        name: E2E Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.19.0"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Build application
              run: npm run build

            - name: Run E2E tests
              run: |
                  if [ "${{ inputs.update_snapshots }}" = "true" ]; then
                    npm run test:e2e -- tests/mobile-filter-responsiveness.spec.ts --grep 'visual regression screenshot' --update-snapshots
                  else
                    npm run test:e2e
                  fi
              env:
                  CI: true

            - name: Upload E2E test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: e2e-test-results
                  path: |
                      playwright-report/
                      test-results/

            - name: Upload Linux screenshots for review
              uses: actions/upload-artifact@v4
              if: inputs.update_snapshots
              with:
                  name: linux-screenshots
                  path: tests/mobile-filter-responsiveness.spec.ts-snapshots/*-linux.png

    performance-tests:
        name: Performance Tests
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.base.ref == 'main'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.19.0"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Build application
              run: npm run build

            - name: Run performance tests
              run: npm run test:performance
              env:
                  CI: true

            - name: Upload performance test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: performance-test-results
                  path: |
                      playwright-report/
                      test-results/

    lint-and-format:
        name: Lint and Format Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.19.0"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format:check

            - name: TypeScript type check
              run: npx tsc --noEmit

    build-test:
        name: Build Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.19.0"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run ETL processing
              run: npm run build:etl

            - name: Build for production
              run: npm run build

            - name: Test production build
              run: npm run preview &

    test-summary:
        name: Test Summary
        runs-on: ubuntu-latest
        needs: [unit-tests, e2e-tests, performance-tests, lint-and-format, build-test]
        if: always()

        steps:
            - name: Check test results
              run: |
                  echo "Unit Tests: ${{ needs.unit-tests.result }}"
                  echo "E2E Tests: ${{ needs.e2e-tests.result }}"
                  echo "Lint/Format: ${{ needs.lint-and-format.result }}"
                  echo "Build Test: ${{ needs.build-test.result }}"

                  if [ "${{ needs.unit-tests.result }}" != "success" ] ||
                     [ "${{ needs.e2e-tests.result }}" != "success" ] ||
                     [ "${{ needs.performance-tests.result }}" != "success" ] ||
                     [ "${{ needs.lint-and-format.result }}" != "success" ] ||
                     [ "${{ needs.build-test.result }}" != "success" ]; then
                    echo "Quality checks failed"
                    exit 1
                  fi
