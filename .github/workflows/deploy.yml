name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Preserve legacy build ordering without reserving the controlled publisher's queue.
concurrency:
  group: legacy-pages-build
  cancel-in-progress: false

jobs:
  publisher-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      ZIVV_CONTROLLED_PUBLISHING: ${{ vars.ZIVV_CONTROLLED_PUBLISHING }}
      ZIVV_MANUAL_PUBLISHER_JOINED: ${{ vars.ZIVV_MANUAL_PUBLISHER_JOINED }}
    steps:
      - name: Select the publication mode
        id: mode
        shell: bash
        run: |
          case "${ZIVV_CONTROLLED_PUBLISHING:-}:${ZIVV_MANUAL_PUBLISHER_JOINED:-}" in
            :|:false|disabled:|disabled:false)
              printf 'mode=legacy\n' >> "$GITHUB_OUTPUT"
              echo 'Legacy publication is active.'
              ;;
            enabled:true)
              printf 'mode=controlled\n' >> "$GITHUB_OUTPUT"
              echo 'Controlled publication is active; legacy Pages effects are skipped.'
              ;;
            *)
              echo '::error::Publisher flags are inconsistent; legacy Pages publication is blocked.' >&2
              exit 1
              ;;
          esac

  # Build job
  build:
    needs: publisher-mode
    if: needs.publisher-mode.result == 'success' && needs.publisher-mode.outputs.mode == 'legacy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify vite installation
        run: |
          ls -la node_modules/.bin/ | grep vite || echo "vite not found in node_modules/.bin"
          npm ls vite || echo "vite not in npm ls"

      - name: Run linter
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run type check
        run: npx tsc -b

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test:run

      - name: Run ingestion and publication checks
        run: npm run test:ingestion

      - name: Build
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Checking vite binary..."
          ls -la node_modules/.bin/vite || true
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            NODE_ENV=production ./node_modules/.bin/vite build
          else
            ./node_modules/.bin/tsc -b && NODE_ENV=production ./node_modules/.bin/vite build
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: [publisher-mode, build]
    # Only an explicitly selected legacy main push may enter production concurrency.
    if: needs.publisher-mode.result == 'success' && needs.publisher-mode.outputs.mode == 'legacy' && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
